<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4ecdd">
<title>破天宗 · 修仙模拟</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%239d2b22'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23f4ecdd' font-family='serif'%3E破%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="wash" aria-hidden="true"></div>

<!-- ============ 登录 ============ -->
<section id="view-auth" class="view is-active">
  <div class="auth-wrap">
    <div class="brand">
      <div class="seal">破</div>
      <h1>破天宗</h1>
      <p class="sub">断层之劫后一千二百年 · 云荒东南 · 落雁原</p>
    </div>

    <div class="card auth-card">
      <form id="authForm" autocomplete="on">
        <label class="field">
          <span>宗门账号</span>
          <input id="authUser" autocomplete="username" autocapitalize="off" spellcheck="false"
                 placeholder="由宗门管理方发放" maxlength="20" required>
        </label>
        <label class="field">
          <span>口令</span>
          <input id="authPass" type="password" autocomplete="current-password" placeholder="至少 6 位" maxlength="64" required>
        </label>
        <p class="hint" id="authHint">账号由宗门管理方统一开立，此处不开放自助注册。</p>
        <button type="submit" class="btn primary block" id="btnLogin">入 宗</button>
      </form>
      <p class="hint tiny">尚未持账号者，请向宗门管理方申领。同一账号在手机、平板与电脑上通用，宗门数据存于云端。</p>
    </div>
  </div>
</section>

<!-- ============ 存档选择 ============ -->
<section id="view-slots" class="view">
  <div class="slots-wrap">
    <header class="slots-head">
      <div>
        <h2>择一宗门</h2>
        <p class="sub" id="slotsUser">—</p>
      </div>
      <div class="row">
        <button class="btn ghost hide" id="btnAdmin">管理台</button>
        <button class="btn ghost" id="btnSignOut">退出</button>
      </div>
    </header>
    <div class="slot-grid" id="slotGrid"></div>
    <p class="hint center" id="slotsHint"></p>
  </div>
</section>

<!-- ============ 首次改密 ============ -->
<section id="view-pass" class="view">
  <div class="auth-wrap">
    <div class="brand">
      <div class="seal">破</div>
      <h1>初入宗门</h1>
      <p class="sub">初始口令由管理方发放，须改密后方可入宗</p>
    </div>
    <div class="card auth-card">
      <form id="passForm" autocomplete="on">
        <label class="field"><span>当前口令</span>
          <input id="pcOld" type="password" autocomplete="current-password" maxlength="64" placeholder="管理方发放的初始口令" required></label>
        <label class="field"><span>新口令</span>
          <input id="pcNew" type="password" autocomplete="new-password" maxlength="64" placeholder="至少 6 位" required></label>
        <label class="field"><span>再输一次</span>
          <input id="pcNew2" type="password" autocomplete="new-password" maxlength="64" placeholder="与新口令一致" required></label>
        <p class="hint" id="passHint">改密后，其他设备上的登录将立即失效。</p>
        <button type="submit" class="btn primary block" id="btnPass">改 密 入 宗</button>
      </form>
      <button class="btn ghost block" id="btnPassOut" style="margin-top:8px">退出登录</button>
    </div>
  </div>
</section>

<!-- ============ 管理台 ============ -->
<section id="view-admin" class="view">
  <div class="admin-wrap">
    <header class="slots-head">
      <div>
        <h2>宗门管理台</h2>
        <p class="sub" id="adminWho">—</p>
      </div>
      <div class="adm-search">
        <input id="admSearch" type="search" maxlength="24" placeholder="搜账号 / 宗门名，回车直达" autocomplete="off">
        <button class="btn ghost" id="btnAdminBack">返回</button>
      </div>
    </header>
    <div class="tabs scroll-x" id="adminTabs" role="tablist">
      <button class="tab is-on" data-atab="overview">概览</button>
      <button class="tab" data-atab="people">账号与玩家</button>
      <button class="tab" data-atab="saves">存档</button>
      <button class="tab" data-atab="codes">发放与码</button>
      <button class="tab" data-atab="season">赛季</button>
      <button class="tab" data-atab="system">系统</button>
    </div>
    <div id="adminStage"></div>
  </div>
</section>

<!-- ============ 游戏主界面：以宗门场景为常驻容器 ============ -->
<section id="view-game" class="view">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnRail" aria-label="导航">☰</button>
    <div class="sect-id">
      <strong id="hSect">破天宗</strong>
      <span id="hFounder">祖师</span>
    </div>
    <div class="hstats">
      <span class="st">开宗 <b id="hYear">1</b> 年</span>
      <span class="st">声望 <b id="hRenown">0</b></span>
      <span class="st hide-sm">灵石 <b id="hStone">0</b></span>
    </div>
    <div class="speed" id="speedBox" role="group" aria-label="时间流速">
      <button data-speed="0" title="暂停">止</button>
      <button data-speed="1" class="on" title="一倍速">一</button>
      <button data-speed="2" title="二倍速">二</button>
      <button data-speed="4" title="四倍速">四</button>
    </div>
    <button class="top-btn" id="btnPending" aria-label="待处理">
      <span>待处理</span><i class="dot" id="pendingDot" hidden></i>
    </button>
    <button class="top-btn" id="btnMsg" aria-label="消息中心">
      <span>消息</span><i class="dot" id="msgDot" hidden></i>
    </button>
  </header>

  <div class="notice-bar" id="noticeBar" hidden></div>

  <div class="game-body">
    <nav class="rail" id="rail" aria-label="宗门导航">
      <div class="rail-grp">
        <span class="rail-t">场景</span>
        <button class="rail-item is-on" data-panel="scene"><i>山</i><span>宗门场景</span></button>
        <button class="rail-item" data-panel="temple"><i>殿</i><span>祖师殿</span><b class="rail-badge" id="templeBadge" hidden></b></button>
      </div>
      <div class="rail-grp">
        <span class="rail-t">机构</span>
        <button class="rail-item" data-panel="disciples"><i>徒</i><span>弟子名录</span></button>
        <button class="rail-item" data-panel="org"><i>阁</i><span>机构席位</span></button>
        <button class="rail-item" data-panel="workshop"><i>坊</i><span>资源工坊</span></button>
      </div>
      <div class="rail-grp">
        <span class="rail-t">事务</span>
        <button class="rail-item" data-panel="pending"><i>待</i><span>待处理</span><b class="rail-badge" id="pendingBadge" hidden></b></button>
        <button class="rail-item" data-panel="messages"><i>信</i><span>消息中心</span><b class="rail-badge" id="msgBadge" hidden></b></button>
        <button class="rail-item" data-panel="autonomy"><i>议</i><span>破天阁</span></button>
        <button class="rail-item" data-panel="tasks"><i>务</i><span>任务派遣</span></button>
        <button class="rail-item" data-panel="chronicle"><i>史</i><span>宗门史</span></button>
      </div>
      <div class="rail-grp">
        <span class="rail-t">外部</span>
        <button class="rail-item" data-panel="world"><i>界</i><span>大世界</span></button>
        <button class="rail-item" data-panel="battle"><i>战</i><span>宗门对战</span></button>
        <button class="rail-item" data-panel="rank"><i>榜</i><span>赛季榜单</span></button>
        <button class="rail-item" data-panel="settings"><i>设</i><span>设置</span></button>
      </div>
      <div class="rail-foot">
        <button class="rail-item mini" id="btnRedeem"><i>兑</i><span>兑换</span></button>
        <button class="rail-item mini" id="btnBackSlots"><i>返</i><span>切换存档</span></button>
      </div>
    </nav>

    <main class="scene-stage" id="sceneStage">
      <canvas id="sceneCanvas" aria-label="宗门场景：山体十层，山脚破天城"></canvas>
      <div class="scene-overlay" id="sceneOverlay"></div>
      <div class="scene-hint" id="sceneHint">选一处建筑，再点一次进入</div>
    </main>
  </div>

  <!-- 单例抽屉：所有功能面板都叠在场景之上 -->
  <aside class="panel" id="panel" aria-hidden="true">
    <header class="pn-head">
      <div class="t">
        <h2 id="panelTitle">宗门</h2>
        <p id="panelSub"></p>
      </div>
      <button class="icon-btn" id="panelClose" aria-label="收起">×</button>
    </header>
    <div class="pn-body" id="panelBody"></div>
  </aside>

  <div class="rail-mask" id="railMask"></div>
</section>

<!-- ============ 祖师殿（独立页面） ============ -->
<section id="view-temple" class="view">
  <div class="temple-wrap">
    <header class="temple-head">
      <div>
        <p class="sub" id="templeSect">破天宗</p>
        <h2>祖师殿</h2>
        <p class="sub">重大事项止于此。一次陈列三件，逐件批阅。</p>
      </div>
      <button class="btn ghost" id="btnTempleBack">回场景</button>
    </header>
    <div class="tabs" id="templeTabs">
      <button class="tab is-on" data-ttab="memo">奏疏</button>
      <button class="tab" data-ttab="law">法度</button>
      <button class="tab" data-ttab="seal">道印</button>
    </div>
    <div id="templeStage"></div>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
